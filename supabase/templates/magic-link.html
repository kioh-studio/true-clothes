<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your verification code — MIEN</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F4F0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F4F0;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">

          <!-- Header -->
          <tr>
            <td style="padding-bottom:40px;" align="center">
              <p style="margin:0;font-size:13px;letter-spacing:0.18em;font-weight:400;color:#1A1A18;text-transform:uppercase;">
                MIEN
              </p>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#FAFAF8;padding:48px 40px 40px;border:1px solid #E8E6E0;">

              <!-- Title -->
              <p style="margin:0 0 8px;font-size:22px;font-weight:300;color:#1A1A18;letter-spacing:-0.01em;line-height:1.3;">
                Your verification code
              </p>
              <p style="margin:0 0 36px;font-size:14px;color:#888880;line-height:1.6;font-weight:300;">
                Enter this code in the app to continue. It expires in 10 minutes.
              </p>

              <!-- OTP block -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#F0EEE8;padding:24px;text-align:center;letter-spacing:0.22em;">
                    <span style="font-size:32px;font-weight:300;color:#1A1A18;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
                      {{ .Token }}
                    </span>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:36px 0 0;">
                <tr>
                  <td style="border-top:1px solid #E8E6E0;padding-top:28px;">
                    <p style="margin:0;font-size:12px;color:#AAAAAA;line-height:1.7;font-weight:300;">
                      If you didn't request this code, you can safely ignore this email. Someone may have entered your email by mistake.
                    </p>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding-top:32px;" align="center">
              <p style="margin:0 0 6px;font-size:11px;color:#AAAAAA;letter-spacing:0.06em;font-weight:400;text-transform:uppercase;">
                MIEN
              </p>
              <p style="margin:0;font-size:11px;color:#C8C6C0;font-weight:300;">
                This is an automated message. Please do not reply.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
