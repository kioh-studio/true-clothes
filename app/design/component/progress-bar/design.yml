COMPONENT_SPEC:
  id: component.progress-bar
  design_path: "app/design/component/progress-bar/"

  purpose:
    short: "Track onboarding progress across steps."
    context: "Used in onboarding flow (see app/design/screen/onboarding/design.md)."
    reusability: "Highly reusable with configurable number of progress points."

  params:
    total_points: integer  # Number of progress points to display
    active_points: array[integer]  # Indices of points to show as bold/filled (0-based, can be multiple)

  default_state:
    total_points: 0  # Empty by default
    active_points: []  # No points bold by default

  visual_specs:
    progress_point:
      width_px: 15
      height_px: 15
      shape: circle
      default: stroke_only
      active: filled
    connecting_line:
      weight_px: 2
      connects: "between adjacent progress points"

  layout:
    responsive: true  # Must work on all device sizes
    spacing: "flexible"  # Use relative units, not fixed pixels

  notes:
    - "Refer to progress-bar.png for overall visual; use progress-bar.svg for precise spacing."
    - "Keep layout responsive; avoid pixel-perfect absolute positioning from the SVG."
    - "Preserve hierarchy and relative spacing instead of exact pixel positions."
